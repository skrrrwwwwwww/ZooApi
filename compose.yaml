services:
  zooapi.web:
    image: zooapi.web
    build:
      context: .
      dockerfile: backend/ZooApi.Web/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ./backend/ZooApi.Web/.env
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB:?Set POSTGRES_DB};Username=${POSTGRES_USER:?Set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - RabbitMq__Host=rabbitmq
      # Креды обязаны совпадать с RABBITMQ_DEFAULT_* у сервиса rabbitmq,
      # иначе MassTransit откатится на guest и не пройдёт авторизацию.
      - RabbitMq__Username=${RABBITMQ_USER:?Set RABBITMQ_USER}
      - RabbitMq__Password=${RABBITMQ_PASS:?Set RABBITMQ_PASS}
      - ConnectionStrings__Redis=redis:6379
      - Authentication__Authority=${JWT_AUTHORITY:?Set JWT_AUTHORITY to the external JWT issuer URL}
      - Authentication__Audience=${JWT_AUDIENCE:?Set JWT_AUDIENCE}
      # Контейнер работает в Production, а user secrets там не грузятся —
      # без этих переменных письма падают на 535. Пароль только из .env,
      # дефолта нет намеренно: лучше явная пустая настройка, чем плейсхолдер.
      - MailSettings__Host=${MAIL_HOST:-smtp.gmail.com}
      - MailSettings__Port=${MAIL_PORT:-587}
      - MailSettings__Username=${MAIL_USERNAME:-}
      - MailSettings__Password=${MAIL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    # curl ставится в финальный образ — в aspnet-образе его нет, и проверка
    # молча падала бы с "executable file not found".
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/health" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:17
    container_name: zoo_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER} -d ${POSTGRES_DB:?Set POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: zoo_rabbit
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?Set RABBITMQ_PASS}
    # В образе rabbitmq нет ни curl, ни wget — проверять брокер можно только
    # его собственной утилитой.
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  redis:
    image: redis:alpine
    container_name: zoo_redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
